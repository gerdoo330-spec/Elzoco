name: Flutter Android build
on:
  push:
    branches:
      - feature/import-section-from-worksheet-ab
      - feature/employee-notification-history-2026-11-09
      - fix/mobile-core-hr-workflows-2026-11-10
      - redesign/mobile-premium-biometric-2026-11-10
      - redesign/visual-identity-v2
      - sync/production-host-2026-11-13
    paths:
      - 'mobile/flutter_app/**'
      - 'api/**'
      - 'src/**'
      - 'db/schema.sql'
      - 'db/migrations/**'
      - '.github/workflows/flutter-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/flutter_app
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          php -l ../../api/mobile.php
          php -l ../../api/announcements.php
          php -l ../../src/bootstrap.php
          php -l ../../src/notify.php
          php -l ../../src/push.php
          php -l ../../src/employee_profile.php
      - name: Package PHP backend update
        run: |
          mkdir -p ../../dist/elzoco-fcm-backend/api ../../dist/elzoco-fcm-backend/src ../../dist/elzoco-fcm-backend/db/migrations
          cp ../../api/mobile.php ../../dist/elzoco-fcm-backend/api/mobile.php
          cp ../../api/announcements.php ../../dist/elzoco-fcm-backend/api/announcements.php
          cp ../../src/bootstrap.php ../../dist/elzoco-fcm-backend/src/bootstrap.php
          cp ../../src/payroll.php ../../dist/elzoco-fcm-backend/src/payroll.php
          cp ../../src/notify.php ../../dist/elzoco-fcm-backend/src/notify.php
          cp ../../src/push.php ../../dist/elzoco-fcm-backend/src/push.php
          cp ../../src/employee_profile.php ../../dist/elzoco-fcm-backend/src/employee_profile.php
          cp ../../db/migrations/2026-11-06-mobile-tokens.sql ../../dist/elzoco-fcm-backend/db/migrations/
          cp ../../db/migrations/2026-11-09-mobile-push-tokens.sql ../../dist/elzoco-fcm-backend/db/migrations/
          cp ../../mobile/FCM-SETUP-FA.md ../../dist/elzoco-fcm-backend/راهنمای-نصب.md
          cd ../../dist
          zip -qr elzoco-fcm-backend-update.zip elzoco-fcm-backend
      - uses: actions/upload-artifact@v4
        with:
          name: elzoco-fcm-backend-update
          path: dist/elzoco-fcm-backend-update.zip
          if-no-files-found: error
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name elzoco_hrm .
      - name: Configure biometric authentication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path('android/app/src/main/kotlin/com/example/elzoco_hrm/MainActivity.kt')
          main.parent.mkdir(parents=True, exist_ok=True)
          main.write_text("""package com.example.elzoco_hrm

          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity : FlutterFragmentActivity()
          """)
          PY
      - name: Pin compatible Android Gradle plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/settings.gradle.kts')
          s = p.read_text()
          lines = []
          for line in s.splitlines(keepends=True):
              if 'com.android.application' in line and 'version "' in line:
                  old = line.split('version "', 1)[1].split('"', 1)[0]
                  line = line.replace('version "' + old + '"', 'version "8.11.1"')
              elif 'org.jetbrains.kotlin.android' in line and 'version "' in line:
                  old = line.split('version "', 1)[1].split('"', 1)[0]
                  line = line.replace('version "' + old + '"', 'version "2.2.20"')
              lines.append(line)
          p.write_text(''.join(lines))
          print(p.read_text())
          PY
      - name: Configure Firebase Android plugin when app config exists
        run: |
          if [ -f android/app/google-services.json ]; then
            python3 - <<'PY'
          from pathlib import Path
          settings = Path('android/settings.gradle.kts')
          text = settings.read_text()
          if 'com.google.gms.google-services' not in text:
              text = text.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services") version "4.4.3" apply false', 1)
              settings.write_text(text)
          app = Path('android/app/build.gradle.kts')
          text = app.read_text()
          if 'com.google.gms.google-services' not in text:
              text = text.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services")', 1)
              app.write_text(text)
          print('Firebase Android Gradle plugin enabled.')
          PY
          else
            echo 'google-services.json not supplied; Firebase runtime setup will remain inactive.'
          fi
      - name: Set Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text().replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          p.write_text(s)
          print('compileSdk set to 36')
          PY
      - name: Ensure Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(manifest)
          root = tree.getroot()
          key = '{http://schemas.android.com/apk/res/android}name'
          for permission in ['android.permission.INTERNET', 'android.permission.POST_NOTIFICATIONS', 'android.permission.USE_BIOMETRIC', 'android.permission.USE_FINGERPRINT']:
              if not any(node.tag == 'uses-permission' and node.get(key) == permission for node in root):
                  ET.SubElement(root, 'uses-permission', {key: permission})
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          print(manifest.read_text())
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Force Android plugins to compile with SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ.get('PUB_CACHE', str(Path.home() / '.pub-cache'))) / 'hosted' / 'pub.dev'
          changed = []
          for p in root.glob('**/android/build.gradle*'):
              if not p.is_file():
                  continue
              is_kotlin = p.name.endswith('.kts')
              lines = p.read_text().splitlines(keepends=True)
              out = []
              touched = False
              for line in lines:
                  stripped = line.lstrip()
                  indent = line[:len(line) - len(stripped)]
                  if stripped.startswith('compileSdkVersion '):
                      line = indent + ('compileSdk = 36' if is_kotlin else 'compileSdkVersion 36') + chr(10)
                      touched = True
                  elif stripped.startswith('compileSdk ') or stripped.startswith('compileSdk ='):
                      line = indent + ('compileSdk = 36' if is_kotlin else 'compileSdk 36') + chr(10)
                      touched = True
                  elif stripped.startswith('compileSdk='):
                      line = indent + 'compileSdk=36' + chr(10)
                      touched = True
                  out.append(line)
              if touched:
                  p.write_text(''.join(out))
                  changed.append(str(p))
          print(f'Updated {len(changed)} plugin Gradle files to compileSdk 36')
          for p in changed:
              print(' -', p)
          PY
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://hrsarv.ir/payroll
      - uses: actions/upload-artifact@v4
        with:
          name: elzoco-hrm-android-apk
          path: mobile/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

# Correct artifact path relative to workspace root
