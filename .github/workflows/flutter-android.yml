name: Flutter Android build
on:
  push:
    branches:
      - feature/import-section-from-worksheet-ab
    paths:
      - 'mobile/flutter_app/**'
      - '.github/workflows/flutter-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name elzoco_hrm .
      - name: Set Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          p.write_text(s)
          print('compileSdk set to 36')
          PY
      - name: Ensure Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(manifest)
          root = tree.getroot()
          key = '{http://schemas.android.com/apk/res/android}name'
          if not any(node.tag == 'uses-permission' and node.get(key) == 'android.permission.INTERNET' for node in root):
              ET.SubElement(root, 'uses-permission', {key: 'android.permission.INTERNET'})
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          print(manifest.read_text())
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Force Android plugins to compile with SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root = Path(os.environ.get('PUB_CACHE', str(Path.home() / '.pub-cache'))) / 'hosted' / 'pub.dev'
          changed = 0
          if root.exists():
              for pattern in ('**/android/build.gradle', '**/android/build.gradle.kts'):
                  for p in root.glob(pattern):
                      s = p.read_text()
                      updated = re.sub(
                          r'(?m)^(\\s*)(compileSdkVersion|compileSdk)(\\s*=\\s*|\\s+)(?:flutter\\.compileSdkVersion|safeExtGet\\([^\\n]*?\\)|[0-9]+)(\\s*)$',
                          lambda m: m.group(1) + m.group(2) + (' = ' if m.group(2) == 'compileSdk' else ' ') + '36' + m.group(4),
                          s
                      )
                      if updated != s:
                          p.write_text(updated)
                          changed += 1
          print(f'Updated {changed} Android plugin Gradle files to compileSdk 36')
          PY
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://hrsarv.ir/payroll
      - uses: actions/upload-artifact@v4
        with:
          name: elzoco-hrm-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
